<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Edit Profil Pegawai</title>
  <style>
    :root {
      --bg:#f8fafc;
      --card:#ffffff;
      --border:#cbd5e1;
      --label:#475569;
      --text:#0f172a;
      --muted:#64748b;
      --accent:#059669;
      --accent-hover:#047857;
      --danger:#dc2626;
      --radius:8px;
    }

    body {
      background:var(--bg);
      font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      margin:0;
      padding:24px;
      color:var(--text);
    }

    .wrap {
      max-width:1000px;
      margin:0 auto;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:0 24px 48px rgba(0,0,0,.06);
      padding:20px 24px 32px;
    }

    h1.title {
      font-size:1rem;
      font-weight:600;
      color:var(--text);
      margin:0 0 4px 0;
    }
    .subtitle {
      font-size:.8rem;
      color:var(--muted);
      line-height:1.4;
      margin-bottom:16px;
    }

    .section-block {
      border:1px solid var(--border);
      border-radius:6px;
      background:#fff;
      margin-bottom:20px;
    }
    .section-head {
      background:#f8fafc;
      border-bottom:1px solid var(--border);
      border-radius:6px 6px 0 0;
      padding:10px 12px;
      font-size:.8rem;
      font-weight:600;
      color:#0f172a;
    }
    .section-body {
      padding:16px 12px 4px;
      font-size:.8rem;
    }

    /* grid */
    .grid-2 {
      display:grid;
      grid-template-columns:1fr;
      gap:16px;
    }
    @media(min-width:700px){
      .grid-2 {
        grid-template-columns:1fr 1fr;
      }
    }

    .grid-1 {
      display:grid;
      grid-template-columns:1fr;
      gap:16px;
    }

    .form-group {
      display:flex;
      flex-direction:column;
      font-size:.8rem;
    }
    .form-label {
      font-size:.7rem;
      color:var(--label);
      margin-bottom:4px;
      font-weight:500;
    }
    .form-input {
      font-size:.8rem;
      padding:8px 10px;
      border:1px solid var(--border);
      border-radius:6px;
      color:var(--text);
      background:#fff;
      line-height:1.4;
    }
    .form-input:focus {
      outline:2px solid var(--accent);
      outline-offset:0;
      border-color:var(--accent);
    }

    .readonly {
      background:#f8fafc;
      color:#475569;
    }

    .row-footer {
      display:flex;
      flex-wrap:wrap;
      justify-content:space-between;
      align-items:flex-start;
      gap:8px;
      margin-top:24px;
    }

    .btn {
      appearance:none;
      border:0;
      border-radius:6px;
      font-size:.8rem;
      font-weight:500;
      cursor:pointer;
      line-height:1.2;
      padding:9px 12px;
      color:#fff;
      text-decoration:none;
      display:inline-block;
    }
    .btn-save {
      background:var(--accent);
    }
    .btn-save:hover {
      background:var(--accent-hover);
    }
    .btn-cancel {
      background:#475569;
    }
    .btn-cancel:hover {
      background:#334155;
    }

    .note {
      flex-basis:100%;
      font-size:.7rem;
      color:var(--muted);
      text-align:center;
      line-height:1.4;
      margin-top:8px;
    }
  </style>
</head>
<body>

<div class="wrap">
  <h1 class="title">Edit Profil Pegawai</h1>
  <div class="subtitle">
    ID Pegawai: <span id="info-id">-</span><br/>
    NIP/NRK: <span id="info-nip">-</span><br/>
    Terakhir diupdate: <span id="info-update">-</span>
  </div>

  <!-- ====== KEPEGAWAIAN ====== -->
  <div class="section-block">
    <div class="section-head">Informasi Kepegawaian</div>
    <div class="section-body">
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">ID (readonly)</label>
          <input class="form-input readonly" id="f_id" readonly />
        </div>

        <div class="form-group">
          <label class="form-label">NIP / NRK / NPP</label>
          <input class="form-input" id="f_nip" placeholder="misal: 1234567890" />
        </div>

        <div class="form-group">
          <label class="form-label">Nama Lengkap</label>
          <input class="form-input" id="f_nama" />
        </div>

        <div class="form-group">
          <label class="form-label">Jabatan</label>
          <input class="form-input" id="f_jabatan" />
        </div>

        <div class="form-group">
          <label class="form-label">UKPD</label>
          <input class="form-input" id="f_ukpd" />
        </div>

        <div class="form-group">
          <label class="form-label">Status Aktif</label>
          <input class="form-input" id="f_status_aktif" placeholder="AKTIF / NON-AKTIF" />
        </div>

        <div class="form-group">
          <label class="form-label">Status Rumpun</label>
          <input class="form-input" id="f_status_rumpun" placeholder="contoh: Tenaga Kesehatan" />
        </div>

        <div class="form-group">
          <label class="form-label">Jenis Kontrak</label>
          <input class="form-input" id="f_jenis_kontrak" placeholder="Tetap / Kontrak / dst" />
        </div>

        <div class="form-group">
          <label class="form-label">Jenis Pegawai</label>
          <input class="form-input" id="f_jenis_pegawai" placeholder="PNS / NON PNS / PPPK / dll" />
        </div>

        <div class="form-group">
          <label class="form-label">TMT Kerja UKPD</label>
          <input class="form-input" id="f_tmt_ukpd" placeholder="contoh: 01-01-2020" />
        </div>
      </div>
    </div>
  </div>

  <!-- ====== IDENTITAS PRIBADI ====== -->
  <div class="section-block">
    <div class="section-head">Identitas Pribadi</div>
    <div class="section-body">
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">NIK</label>
          <input class="form-input" id="f_nik" />
        </div>

        <div class="form-group">
          <label class="form-label">Jenis Kelamin</label>
          <input class="form-input" id="f_jk" placeholder="Laki-laki / Perempuan" />
        </div>

        <div class="form-group">
          <label class="form-label">Tempat Lahir</label>
          <input class="form-input" id="f_tempat_lahir" />
        </div>

        <div class="form-group">
          <label class="form-label">Tanggal Lahir</label>
          <input class="form-input" id="f_tanggal_lahir" placeholder="YYYY-MM-DD atau format lain" />
        </div>

        <div class="form-group">
          <label class="form-label">Agama</label>
          <input class="form-input" id="f_agama" />
        </div>

        <div class="form-group">
          <label class="form-label">Status Pernikahan</label>
          <input class="form-input" id="f_status_nikah" placeholder="MENIKAH / BELUM MENIKAH / dll" />
        </div>

        <div class="form-group">
          <label class="form-label">Gelar Depan</label>
          <input class="form-input" id="f_gelar_depan" placeholder="Dr., dr., ... (opsional)" />
        </div>

        <div class="form-group">
          <label class="form-label">Gelar Belakang</label>
          <input class="form-input" id="f_gelar_belakang" placeholder="M.Kes, Sp.A, ... (opsional)" />
        </div>

        <div class="form-group">
          <label class="form-label">Golongan Darah</label>
          <input class="form-input" id="f_gol_darah" placeholder="A / B / O / AB" />
        </div>
      </div>
    </div>
  </div>

  <!-- ====== PENDIDIKAN & KONTAK ====== -->
  <div class="section-block">
    <div class="section-head">Pendidikan & Kontak</div>
    <div class="section-body">
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Jenjang Pendidikan</label>
          <input class="form-input" id="f_jenjang" placeholder="SMA / D3 / S1 / S2 / dll" />
        </div>

        <div class="form-group">
          <label class="form-label">Jurusan Pendidikan</label>
          <input class="form-input" id="f_jurusan" />
        </div>

        <div class="form-group">
          <label class="form-label">No. Telepon</label>
          <input class="form-input" id="f_telp" />
        </div>

        <div class="form-group">
          <label class="form-label">Email</label>
          <input class="form-input" id="f_email" />
        </div>
      </div>
    </div>
  </div>

  <!-- ====== ALAMAT ====== -->
  <div class="section-block">
    <div class="section-head">Alamat</div>
    <div class="section-body">
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Alamat KTP</label>
          <textarea class="form-input" id="f_alamat_ktp" rows="2"></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Alamat Domisili</label>
          <textarea class="form-input" id="f_alamat_domisili" rows="2"></textarea>
        </div>
      </div>
    </div>
  </div>

  <!-- ====== CATATAN ====== -->
  <div class="section-block">
    <div class="section-head">Catatan Administrasi</div>
    <div class="section-body">
      <div class="grid-1">
        <div class="form-group">
          <label class="form-label">Catatan Revisi Biodata / Keterangan Lain</label>
          <textarea class="form-input" id="f_catatan" rows="2"></textarea>
        </div>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="row-footer">
    <button class="btn btn-save" id="btnSimpan">💾 Simpan Perubahan</button>
    <button class="btn btn-cancel" id="btnBatal">Batal</button>

    <div class="note">
      Perubahan ini akan langsung tersimpan ke Google Sheet melalui API.
    </div>
  </div>
</div>

<script>
const API_BASE = 'http://localhost:3000'; // sesuaikan kalau backend beda port / pakai ngrok
let currentId = null;

// Ambil parameter ?id=...
function getQueryParam(name){
  const params = new URLSearchParams(window.location.search);
  return params.get(name);
}

// Isi field form dari objek pegawai
function fillForm(p) {
  currentId = p.id || null;

  // Info header
  document.getElementById('info-id').textContent = p.id || '-';
  document.getElementById('info-nip').textContent = p.nip || p.npwp || '-';
  document.getElementById('info-update').textContent = p.tgl_update || '-';

  // Field utama
  document.getElementById('f_id').value = p.id || '';
  document.getElementById('f_nip').value = p.nip || p.npwp || '';
  document.getElementById('f_nama').value = p.nama || '';
  document.getElementById('f_jabatan').value = p.jabatan || '';
  document.getElementById('f_ukpd').value = p.ukpd || '';
  document.getElementById('f_status_aktif').value = p.nama_status_aktif || '';
  document.getElementById('f_status_rumpun').value = p.nama_status_rumpun || '';
  document.getElementById('f_jenis_kontrak').value = p.jenis_kontrak || '';
  document.getElementById('f_jenis_pegawai').value = p.nama_jenis_pegawai || '';
  document.getElementById('f_tmt_ukpd').value = p.tmt_kerja_ukpd || '';

  document.getElementById('f_nik').value = p.nik || '';
  document.getElementById('f_jk').value = p.jenis_kelamin || '';
  document.getElementById('f_tempat_lahir').value = p.tempat_lahir || '';
  document.getElementById('f_tanggal_lahir').value = p.tanggal_lahir || '';
  document.getElementById('f_agama').value = p.agama || '';
  document.getElementById('f_status_nikah').value = p.status_pernikahan || '';
  document.getElementById('f_gelar_depan').value = p.gelar_depan || '';
  document.getElementById('f_gelar_belakang').value = p.gelar_belakang || '';
  document.getElementById('f_gol_darah').value = p.golongan_darah || '';

  document.getElementById('f_jenjang').value = p.jenjang_pendidikan || '';
  document.getElementById('f_jurusan').value = p.jurusan_pendidikan || '';
  document.getElementById('f_telp').value = p.no_tlp || '';
  document.getElementById('f_email').value = p.email || '';

  document.getElementById('f_alamat_ktp').value = p.alamat_ktp || '';
  document.getElementById('f_alamat_domisili').value = p.alamat_domisili || '';
  document.getElementById('f_catatan').value = p.catatan_revisi_biodata || '';
}

// Kumpulin data dari form utk dikirim PUT
function collectFormData() {
  return {
    id: document.getElementById('f_id').value.trim(),
    nip: document.getElementById('f_nip').value.trim(),
    nama: document.getElementById('f_nama').value.trim(),
    jabatan: document.getElementById('f_jabatan').value.trim(),
    ukpd: document.getElementById('f_ukpd').value.trim(),
    nama_status_aktif: document.getElementById('f_status_aktif').value.trim(),
    nama_status_rumpun: document.getElementById('f_status_rumpun').value.trim(),
    jenis_kontrak: document.getElementById('f_jenis_kontrak').value.trim(),
    nama_jenis_pegawai: document.getElementById('f_jenis_pegawai').value.trim(),
    tmt_kerja_ukpd: document.getElementById('f_tmt_ukpd').value.trim(),

    nik: document.getElementById('f_nik').value.trim(),
    jenis_kelamin: document.getElementById('f_jk').value.trim(),
    tempat_lahir: document.getElementById('f_tempat_lahir').value.trim(),
    tanggal_lahir: document.getElementById('f_tanggal_lahir').value.trim(),
    agama: document.getElementById('f_agama').value.trim(),
    status_pernikahan: document.getElementById('f_status_nikah').value.trim(),
    gelar_depan: document.getElementById('f_gelar_depan').value.trim(),
    gelar_belakang: document.getElementById('f_gelar_belakang').value.trim(),
    golongan_darah: document.getElementById('f_gol_darah').value.trim(),

    jenjang_pendidikan: document.getElementById('f_jenjang').value.trim(),
    jurusan_pendidikan: document.getElementById('f_jurusan').value.trim(),
    no_tlp: document.getElementById('f_telp').value.trim(),
    email: document.getElementById('f_email').value.trim(),

    alamat_ktp: document.getElementById('f_alamat_ktp').value.trim(),
    alamat_domisili: document.getElementById('f_alamat_domisili').value.trim(),
    catatan_revisi_biodata: document.getElementById('f_catatan').value.trim()
  };
}

// load data pegawai by ID
async function loadData() {
  const id = getQueryParam('id');
  if (!id) {
    alert('URL harus ada ?id=..., contoh: edit_profil.html?id=2');
    return;
  }

  try {
    const res = await fetch(`${API_BASE}/pegawai/${id}`);
    const json = await res.json();
    if (!json.success) {
      alert('Data tidak ditemukan');
      return;
    }
    fillForm(json.data);
  } catch (e) {
    console.error(e);
    alert('Gagal mengambil data pegawai.');
  }
}

// kirim PUT untuk update
async function simpanPerubahan() {
  if (!currentId) {
    alert('ID kosong, tidak bisa simpan.');
    return;
  }

  const bodyData = collectFormData();

  try {
    const res = await fetch(`${API_BASE}/pegawai/${currentId}`, {
      method: 'PUT',
      headers: { 'Content-Type':'application/json' },
      body: JSON.stringify(bodyData)
    });

    const json = await res.json();
    if (!json.success) {
      alert('Gagal simpan: ' + (json.message || '(unknown)'));
      return;
    }

    alert('Berhasil disimpan!');
    // balik ke profil
    window.location.href = 'profil.html?id=' + encodeURIComponent(currentId);
  } catch (err) {
    console.error(err);
    alert('Gagal simpan perubahan: ' + err);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  // load isi form dari server
  loadData();

  // tombol simpan
  document.getElementById('btnSimpan').addEventListener('click', () => {
    simpanPerubahan();
  });

  // tombol batal
  document.getElementById('btnBatal').addEventListener('click', () => {
    if (currentId) {
      window.location.href = 'profil.html?id=' + encodeURIComponent(currentId);
    } else {
      window.location.href = 'index.html'; // fallback
    }
  });
});
</script>

</body>
</html>
